<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 360" width="100%" height="100%">
  <defs>
    <!-- Brushed Titanium Chrome Face Gradient -->
    <linearGradient id="lk-steel-grad" x1="0%" y1="15%" x2="100%" y2="85%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="12%" stop-color="#E2E8F0" />
      <stop offset="26%" stop-color="#8FA1B3" />
      <stop offset="40%" stop-color="#C2CFDD" />
      <stop offset="56%" stop-color="#F1F5F9" />
      <stop offset="72%" stop-color="#68798C" />
      <stop offset="88%" stop-color="#9FB0C1" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Specular metal sheen -->
    <linearGradient id="lk-sheen" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85" />
      <stop offset="30%" stop-color="#CBD5E1" stop-opacity="0.2" />
      <stop offset="65%" stop-color="#FFFFFF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.1" />
    </linearGradient>

    <!-- 3D Extrusion Side Gradients -->
    <linearGradient id="lk-side-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="30%" stop-color="#1E293B" />
      <stop offset="70%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="lk-side-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748B" />
      <stop offset="40%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- 3D Drop Shadow Filters -->
    <filter id="lk-shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="12" flood-color="#000000" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.75" />
    </filter>

    <!-- Cyan Flare Gradients -->
    <radialGradient id="lk-cyan-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="8%" stop-color="#BAE6FD" stop-opacity="0.95" />
      <stop offset="22%" stop-color="#38BDF8" stop-opacity="0.85" />
      <stop offset="45%" stop-color="#0284C7" stop-opacity="0.45" />
      <stop offset="75%" stop-color="#0369A1" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#082F49" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="lk-streak-h" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="25%" stop-color="#38BDF8" stop-opacity="0.25" />
      <stop offset="48%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="52%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="75%" stop-color="#38BDF8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="lk-streak-v" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="30%" stop-color="#38BDF8" stop-opacity="0.25" />
      <stop offset="48%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="52%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="70%" stop-color="#38BDF8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- 3D Monogram Group -->
  <g filter="url(#lk-shadow)" transform="translate(165, 185)">
    <g fill="url(#lk-side-dark)" stroke="#06090E" stroke-width="1">
      <path d="
        M 0,-150
        L 100,-56
        L 68,-30
        L 32,-60
        L 32,5
        L 92,54
        C 142,92 146,155 100,198
        C 54,240 -40,242 -98,202
        C -124,182 -138,154 -132,135
        L -96,135
        C -100,146 -88,166 -66,180
        C -28,202 36,196 68,166
        C 92,136 88,96 56,70
        L -12,18
        C -42,-6 -52,-36 -32,-66
        L -60,-38
        L -100,-68
        Z
      " transform="translate(0, 15)" opacity="0.96" />
      <path d="M -132,-75 L -132,-42 L -60,-42 L -60,-75 Z" transform="translate(0, 15)" />
      <path d="M -138,72 L -138,110 L -48,110 L -48,72 Z" transform="translate(0, 15)" />
    </g>

    <g stroke="none">
      <polygon points="0,-150 -100,-68 -100,-53 0,-135" fill="url(#lk-side-dark)" />
      <polygon points="0,-150 100,-56 100,-41 0,-135" fill="url(#lk-side-light)" />
      <polygon points="-132,-75 -132,-42 -132,-27 -132,-60" fill="#0F172A" />
      <polygon points="-132,-42 -60,-42 -60,-27 -132,-27" fill="#090D14" />
      <polygon points="-138,72 -138,110 -138,125 -138,87" fill="#0F172A" />
      <polygon points="-138,110 -48,110 -48,125 -138,125" fill="#06080D" />
      <path d="
        M 100,198
        C 54,240 -40,242 -98,202
        L -98,217
        C -40,257 54,255 100,213
        Z
      " fill="#0B0F17" />
    </g>

    <g fill="url(#lk-steel-grad)" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.2">
      <path d="
        M 0,-150
        L 100,-56
        L 68,-30
        L 32,-60
        L 32,5
        L 92,54
        C 142,92 146,155 100,198
        C 54,240 -40,242 -98,202
        C -124,182 -138,154 -132,135
        L -96,135
        C -100,146 -88,166 -66,180
        C -28,202 36,196 68,166
        C 92,136 88,96 56,70
        L -12,18
        C -42,-6 -52,-36 -32,-66
        L -60,-38
        L -100,-68
        Z
      " />
      <path d="M -65,-75 L -132,-75 L -132,-42 L -52,-42 L -32,-62 Z" />
      <path d="M -22,72 L -138,72 L -138,110 L -42,110 L 2,72 Z" />
      <path d="M 46,-48 L 90,-22 C 120,0 126,38 98,68 L 68,42 C 84,22 80,2 58,-16 Z" />
    </g>

    <g fill="url(#lk-sheen)" opacity="0.4" pointer-events="none">
      <path d="M 0,-150 L 100,-56 L 68,-30 L 32,-60 L 32,5 L 0,-150 Z" />
      <path d="M -65,-75 L -132,-75 L -132,-42 L -52,-42 Z" />
      <path d="M -22,72 L -138,72 L -138,110 L -42,110 Z" />
    </g>

    <g stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="0.8" fill="none">
      <path d="M 0,-150 L 100,-56" />
      <path d="M 0,-150 L -100,-68" />
      <path d="M -132,-75 L -65,-75" />
      <path d="M -138,72 L -22,72" />
      <path d="M -138,110 L -42,110" />
    </g>
  </g>

  <!-- Cyan Lens Flare -->
  <g transform="translate(165, 35)" pointer-events="none">
    <circle cx="0" cy="0" r="100" fill="url(#lk-cyan-glow)" opacity="0.85" />
    <circle cx="0" cy="0" r="38" fill="url(#lk-cyan-glow)" opacity="0.95" />
    <ellipse cx="0" cy="0" rx="200" ry="2.6" fill="url(#lk-streak-h)" />
    <ellipse cx="0" cy="0" rx="115" ry="4" fill="url(#lk-streak-h)" opacity="0.75" />
    <ellipse cx="0" cy="0" rx="2.6" ry="68" fill="url(#lk-streak-v)" />
    <g transform="rotate(45)">
      <ellipse cx="0" cy="0" rx="35" ry="1.6" fill="url(#lk-streak-h)" opacity="0.7" />
      <ellipse cx="0" cy="0" rx="1.6" ry="35" fill="url(#lk-streak-v)" opacity="0.7" />
    </g>
    <circle cx="0" cy="0" r="5" fill="#14161D" />
  </g>

  <!-- ZENITH STUDIO Typography (White / Steel) -->
  <g filter="url(#lk-shadow)" transform="translate(355, 170)">
    <text
      x="0"
      y="0"
      font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Montserrat', 'Inter', 'Segoe UI', sans-serif"
      font-weight="900"
      font-size="102"
      fill="#14161D"
      letter-spacing="0.04em"
    >ZENITH</text>
    <text
      x="40"
      y="82"
      font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Montserrat', 'Inter', 'Segoe UI', sans-serif"
      font-weight="500"
      font-size="72"
      fill="#334155"
      letter-spacing="0.04em"
    >STUDIO</text>
  </g>
</svg>