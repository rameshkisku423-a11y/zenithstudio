<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
<defs>

        <radialGradient id="bg-grad" cx="50%" cy="46%" r="60%">
          <stop offset="0%" stop-color="#1E242C" />
          <stop offset="35%" stop-color="#13171E" />
          <stop offset="70%" stop-color="#0C0E13" />
          <stop offset="100%" stop-color="#050608" />
        </radialGradient>
        <pattern id="grain" width="300" height="4" patternUnits="userSpaceOnUse">
          <line x1="0" y1="1" x2="300" y2="1" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1" stroke-dasharray="40,15,60,20" />
          <line x1="0" y1="3" x2="300" y2="3" stroke="#000000" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="20,30,50,15" />
        </pattern>
        

      <!-- Brushed Titanium Chrome Face Gradients -->
      <linearGradient id="steel-grad" x1="0%" y1="10%" x2="100%" y2="90%">
        <stop offset="0%" stop-color="#FFFFFF" />
        <stop offset="12%" stop-color="#DCE4EC" />
        <stop offset="26%" stop-color="#8B9CAE" />
        <stop offset="40%" stop-color="#BDCBD9" />
        <stop offset="55%" stop-color="#EDF2F7" />
        <stop offset="72%" stop-color="#6C7D8F" />
        <stop offset="88%" stop-color="#9FB0C1" />
        <stop offset="100%" stop-color="#475569" />
      </linearGradient>

      <!-- Horizontal Brushed Texture Overlay for the metal surface -->
      <linearGradient id="specular-sheen" x1="20%" y1="0%" x2="80%" y2="100%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
        <stop offset="30%" stop-color="#CBD5E1" stop-opacity="0.2" />
        <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.7" />
        <stop offset="100%" stop-color="#334155" stop-opacity="0.1" />
      </linearGradient>

      <!-- 3D Bevel / Extrusion Downward Side Walls -->
      <linearGradient id="side-dark" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#334155" />
        <stop offset="30%" stop-color="#1E293B" />
        <stop offset="70%" stop-color="#0F172A" />
        <stop offset="100%" stop-color="#020617" />
      </linearGradient>

      <linearGradient id="side-light" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#64748B" />
        <stop offset="40%" stop-color="#334155" />
        <stop offset="100%" stop-color="#0F172A" />
      </linearGradient>

      <!-- Drop Shadows -->
      <filter id="drop-shadow-3d" x="-30%" y="-30%" width="160%" height="170%">
        <feDropShadow dx="0" dy="24" stdDeviation="16" flood-color="#000000" flood-opacity="0.8" />
        <feDropShadow dx="0" dy="10" stdDeviation="6" flood-color="#000000" flood-opacity="0.9" />
        <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#000000" flood-opacity="0.95" />
      </filter>

      <!-- Cyan Starburst Flare Gradients -->
      <radialGradient id="cyan-core-glow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
        <stop offset="8%" stop-color="#BAE6FD" stop-opacity="0.95" />
        <stop offset="22%" stop-color="#38BDF8" stop-opacity="0.85" />
        <stop offset="45%" stop-color="#0284C7" stop-opacity="0.45" />
        <stop offset="75%" stop-color="#0369A1" stop-opacity="0.15" />
        <stop offset="100%" stop-color="#082F49" stop-opacity="0" />
      </radialGradient>

      <linearGradient id="streak-h" x1="0%" y1="50%" x2="100%" y2="50%">
        <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
        <stop offset="25%" stop-color="#38BDF8" stop-opacity="0.2" />
        <stop offset="48%" stop-color="#FFFFFF" stop-opacity="0.95" />
        <stop offset="52%" stop-color="#FFFFFF" stop-opacity="0.95" />
        <stop offset="75%" stop-color="#38BDF8" stop-opacity="0.2" />
        <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
      </linearGradient>

      <linearGradient id="streak-v" x1="50%" y1="0%" x2="50%" y2="100%">
        <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
        <stop offset="30%" stop-color="#38BDF8" stop-opacity="0.25" />
        <stop offset="48%" stop-color="#FFFFFF" stop-opacity="0.95" />
        <stop offset="52%" stop-color="#FFFFFF" stop-opacity="0.95" />
        <stop offset="70%" stop-color="#38BDF8" stop-opacity="0.25" />
        <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
      </linearGradient>
    </defs>
    
<rect width="1000" height="600" fill="url(#bg-grad)" />
<rect width="1000" height="600" fill="url(#grain)" />
<g filter="url(#drop-shadow-3d)" transform="translate(500, 310)">

      <!-- 3D Extrusion Side Body -->
      <g fill="url(#side-dark)" stroke="#06090E" stroke-width="1">
        <!-- Main Extrusion Silhouette -->
        <path d="
          M 0,-150
          L 100,-56
          L 68,-30
          L 32,-60
          L 32,5
          L 92,54
          C 142,92 146,155 100,198
          C 54,240 -40,242 -98,202
          C -124,182 -138,154 -132,135
          L -96,135
          C -100,146 -88,166 -66,180
          C -28,202 36,196 68,166
          C 92,136 88,96 56,70
          L -12,18
          C -42,-6 -52,-36 -32,-66
          L -60,-38
          L -100,-68
          Z
        " transform="translate(0, 15)" opacity="0.96" />

        <!-- Top Z Arm Extrusion -->
        <path d="M -132,-75 L -132,-42 L -60,-42 L -60,-75 Z" transform="translate(0, 15)" />
        <!-- Bottom Z Arm Extrusion -->
        <path d="M -138,72 L -138,110 L -48,110 L -48,72 Z" transform="translate(0, 15)" />
      </g>

      <!-- Connecting Side Wall Quads -->
      <g stroke="none">
        <!-- Left Summit Slope Side -->
        <polygon points="0,-150 -100,-68 -100,-53 0,-135" fill="url(#side-dark)" />
        <!-- Right Summit Slope Side -->
        <polygon points="0,-150 100,-56 100,-41 0,-135" fill="url(#side-light)" />
        <!-- Top Z Left Vertical Wall -->
        <polygon points="-132,-75 -132,-42 -132,-27 -132,-60" fill="#0F172A" />
        <!-- Top Z Bottom Underside Wall -->
        <polygon points="-132,-42 -60,-42 -60,-27 -132,-27" fill="#090D14" />
        <!-- Bottom Z Left Vertical Wall -->
        <polygon points="-138,72 -138,110 -138,125 -138,87" fill="#0F172A" />
        <!-- Bottom Z Underside Wall -->
        <polygon points="-138,110 -48,110 -48,125 -138,125" fill="#06080D" />
        <!-- S Outer Bottom Sweep Wall -->
        <path d="
          M 100,198
          C 54,240 -40,242 -98,202
          L -98,217
          C -40,257 54,255 100,213
          Z
        " fill="#0B0F17" />
      </g>

      <!-- Front Metallic Face -->
      <g fill="url(#steel-grad)" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.2">
        <!-- Summit Chevron & Central Interlocking Monogram -->
        <path d="
          M 0,-150
          L 100,-56
          L 68,-30
          L 32,-60
          L 32,5
          L 92,54
          C 142,92 146,155 100,198
          C 54,240 -40,242 -98,202
          C -124,182 -138,154 -132,135
          L -96,135
          C -100,146 -88,166 -66,180
          C -28,202 36,196 68,166
          C 92,136 88,96 56,70
          L -12,18
          C -42,-6 -52,-36 -32,-66
          L -60,-38
          L -100,-68
          Z
        " />

        <!-- Top Z Horizontal Bar (Left) -->
        <path d="
          M -65,-75
          L -132,-75
          L -132,-42
          L -52,-42
          L -32,-62
          Z
        " />

        <!-- Bottom Z Horizontal Bar (Left) -->
        <path d="
          M -22,72
          L -138,72
          L -138,110
          L -42,110
          L 2,72
          Z
        " />

        <!-- Top S Upper Curved Wing (Right) -->
        <path d="
          M 46,-48
          L 90,-22
          C 120,0 126,38 98,68
          L 68,42
          C 84,22 80,2 58,-16
          Z
        " />
      </g>

      <!-- Brushed Metal Face Sheen Overlay -->
      <g fill="url(#specular-sheen)" opacity="0.4" pointer-events="none">
        <path d="M 0,-150 L 100,-56 L 68,-30 L 32,-60 L 32,5 L 0,-150 Z" />
        <path d="M -65,-75 L -132,-75 L -132,-42 L -52,-42 Z" />
        <path d="M -22,72 L -138,72 L -138,110 L -42,110 Z" />
      </g>

      <!-- Crisp Specular Edge Highlight Lines -->
      <g stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="0.75" fill="none">
        <path d="M 0,-150 L 100,-56" />
        <path d="M 0,-150 L -100,-68" />
        <path d="M -132,-75 L -65,-75" />
        <path d="M -138,72 L -22,72" />
        <path d="M -138,110 L -42,110" />
      </g>
    </g>
    

    <!-- Cyan Starburst Lens Flare at the Summit Apex -->
    <g transform="translate(500, 160)" pointer-events="none">
      <!-- Radial Aura -->
      <circle cx="0" cy="0" r="105" fill="url(#cyan-core-glow)" opacity="0.85" />
      <circle cx="0" cy="0" r="42" fill="url(#cyan-core-glow)" opacity="0.95" />

      <!-- Horizontal Anamorphic Flare Streak -->
      <ellipse cx="0" cy="0" rx="220" ry="2.8" fill="url(#streak-h)" />
      <ellipse cx="0" cy="0" rx="130" ry="4.5" fill="url(#streak-h)" opacity="0.75" />

      <!-- Vertical Laser Ray -->
      <ellipse cx="0" cy="0" rx="2.8" ry="75" fill="url(#streak-v)" />

      <!-- 45-Degree Starburst Diamond Rays -->
      <g transform="rotate(45)">
        <ellipse cx="0" cy="0" rx="40" ry="1.8" fill="url(#streak-h)" opacity="0.7" />
        <ellipse cx="0" cy="0" rx="1.8" ry="40" fill="url(#streak-v)" opacity="0.7" />
      </g>
      <g transform="rotate(-45)">
        <ellipse cx="0" cy="0" rx="32" ry="1.5" fill="url(#streak-h)" opacity="0.6" />
        <ellipse cx="0" cy="0" rx="1.5" ry="32" fill="url(#streak-v)" opacity="0.6" />
      </g>

      <!-- Center Pure White Fusion Point -->
      <circle cx="0" cy="0" r="5.5" fill="#FFFFFF" />
      <circle cx="0" cy="0" r="2.5" fill="#E0F2FE" />
    </g>
    

        <g transform="translate(940, 540)" opacity="0.35">
          <path d="M 0,-14 L 4,-3 L 15,0 L 4,3 L 0,14 L -4,3 L -15,0 L -4,-3 Z" fill="#94A3B8" />
        </g>
        
</svg>